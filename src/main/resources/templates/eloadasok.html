
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">

<!-- Közös HEAD: Bootstrap 5 és saját CSS -->
<head th:replace="~{fragments/head :: head('Előadások')}"></head>

<body>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Oldal tartalma -->
<main class="container py-5">

    <!-- Oldal címe -->
    <section class="mb-4">

        <h1 class="display-5 fw-bold">
            Előadások listája
        </h1>

        <p class="text-secondary">
            Az adatbázisban található mozielőadások
            megtekintése.
        </p>

    </section>

    <!-- Előadások táblázata -->
    <section class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h2 class="h4 mb-4">
                Adatbázisban található előadások
            </h2>

            <div class="table-responsive">

                <table class="table table-striped table-hover
                              table-bordered align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Film címe</th>
                        <th scope="col">Mozi neve</th>
                        <th scope="col">Dátum</th>
                        <th scope="col">Nézőszám</th>
                        <th scope="col">Bevétel (Ft)</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="eloadas : ${eloadasok.content}">

                        <td th:text="${eloadas.id}"></td>

                        <td th:text="${eloadas.filmCim}"></td>

                        <td th:text="${eloadas.moziNev}"></td>

                        <td th:text="${eloadas.datum}"></td>

                        <td th:text="${eloadas.nezoszam}"></td>

                        <td th:text="${eloadas.bevetel}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- Üres lista kezelése -->
            <div class="alert alert-info"
                 th:if="${eloadasok.isEmpty()}">

                Jelenleg nincs megjeleníthető előadás.

            </div>

            <!-- Lapozás -->
            <nav class="d-flex justify-content-center mt-4"
                 aria-label="Előadások lapozása"
                 th:if="${totalPages > 1}">

                <ul class="pagination flex-wrap">

                    <!-- Előző oldal -->
                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/eloadasok(page=${currentPage - 1})}"
                           th:attr="aria-disabled=${currentPage == 0}">
                            Előző
                        </a>

                    </li>

                    <!-- Aktuális oldal -->
                    <li class="page-item disabled">

                        <span class="page-link">

                            Oldal:
                            <strong th:text="${currentPage + 1}"></strong>
                            /
                            <strong th:text="${totalPages}"></strong>

                        </span>

                    </li>

                    <!-- Következő oldal -->
                    <li class="page-item"
                        th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/eloadasok(page=${currentPage + 1})}"
                           th:attr="aria-disabled=${currentPage + 1 >= totalPages}">
                            Következő
                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </section>

    <!-- Visszanavigálás -->
    <div class="mt-4">

        <a th:href="@{/}"
           class="btn btn-outline-secondary">

            Vissza a főoldalra

        </a>

        <a th:href="@{/adatbazis}"
           class="btn btn-outline-primary ms-2">

            Adatbázis áttekintése

        </a>

    </div>

</main>

<!-- Közös lábléc -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JavaScript -->
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
