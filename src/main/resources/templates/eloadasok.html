
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Előadások - Mozi nyilvántartó</title>
</head>
<body>

<h1>Előadások listája</h1>

<!-- Navigáció -->
<nav>
    <a th:href="@{/}">Főoldal</a>
    |
    <a th:href="@{/filmek}">Filmek</a>
    |
    <a th:href="@{/mozik}">Mozik</a>
    |
    <a th:href="@{/eloadasok}">Előadások</a>
</nav>

<hr>

<!-- Előadások táblázata -->
<table border="1" cellpadding="8" cellspacing="0">

    <thead>
    <tr>
        <th>ID</th>
        <th>Film címe</th>
        <th>Mozi neve</th>
        <th>Dátum</th>
        <th>Nézőszám</th>
        <th>Bevétel (Ft)</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="eloadas : ${eloadasok.content}">

        <td th:text="${eloadas.id}"></td>

        <td th:text="${eloadas.filmCim}"></td>

        <td th:text="${eloadas.moziNev}"></td>

        <td th:text="${eloadas.datum}"></td>

        <td th:text="${eloadas.nezoszam}"></td>

        <td th:text="${eloadas.bevetel}"></td>

    </tr>

    </tbody>

</table>

<!-- Üres lista kezelése -->
<p th:if="${eloadasok.isEmpty()}">
    Jelenleg nincs megjeleníthető előadás.
</p>

<!-- Lapozás -->
<div th:if="${totalPages > 1}">

    <hr>

    <a th:if="${currentPage > 0}"
       th:href="@{/eloadasok(page=${currentPage - 1})}">
        Előző
    </a>

    <span>
        Oldal:
        <strong th:text="${currentPage + 1}"></strong>
        /
        <strong th:text="${totalPages}"></strong>
    </span>

    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/eloadasok(page=${currentPage + 1})}">
        Következő
    </a>

</div>

<hr>

<a th:href="@{/}">Vissza a főoldalra</a>

</body>
</html>
