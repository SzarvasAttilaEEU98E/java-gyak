
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Film kezelése - Admin</title>
</head>
<body>

<h1 th:text="${film.id == null}
        ? 'Új film hozzáadása'
        : 'Film szerkesztése'">
    Film kezelése
</h1>

<nav>
    <a th:href="@{/admin}">Admin főoldal</a>
    |
    <a th:href="@{/admin/filmek}">Filmek kezelése</a>
</nav>

<hr>

<!-- Üzleti validációs hiba -->
<p th:if="${error != null}"
   th:text="${error}"
   style="color: red;">
</p>

<form th:action="@{/admin/filmek/mentes}"
      th:object="${film}"
      method="post">

    <!-- Film azonosítója -->
    <input type="hidden" th:field="*{id}">

    <!-- Film címe -->
    <div>
        <label for="cim">Film címe:</label>

        <input type="text"
               id="cim"
               th:field="*{cim}"
               required>

        <p th:if="${#fields.hasErrors('cim')}"
           th:errors="*{cim}"
           style="color: red;">
        </p>
    </div>

    <br>

    <!-- Megjelenési év -->
    <div>
        <label for="ev">Megjelenési év:</label>

        <input type="number"
               id="ev"
               th:field="*{ev}"
               min="1888"
               required>

        <p th:if="${#fields.hasErrors('ev')}"
           th:errors="*{ev}"
           style="color: red;">
        </p>
    </div>

    <br>

    <!-- Film hossza -->
    <div>
        <label for="hossz">Film hossza (perc):</label>

        <input type="number"
               id="hossz"
               th:field="*{hossz}"
               min="1"
               max="400"
               required>

        <p th:if="${#fields.hasErrors('hossz')}"
           th:errors="*{hossz}"
           style="color: red;">
        </p>
    </div>

    <br>

    <!-- Mentés -->
    <button type="submit"
            th:text="${film.id == null}
                    ? 'Film hozzáadása'
                    : 'Módosítások mentése'">
        Mentés
    </button>

    <a th:href="@{/admin/filmek}">Mégse</a>

</form>

<hr>

<form th:action="@{/logout}" method="post">
    <button type="submit">Kijelentkezés</button>
</form>

</body>
</html>
