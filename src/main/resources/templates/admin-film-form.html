
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">

<!-- Közös HEAD: Bootstrap 5 és saját CSS -->
<head th:replace="~{fragments/head :: head('Film kezelése')}"></head>

<body>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Oldal tartalma -->
<main class="container py-5">

    <!-- Oldal címe -->
    <section class="mb-4">

        <h1 class="display-5 fw-bold"
            th:text="${film.id == null}
                ? 'Új film hozzáadása'
                : 'Film szerkesztése'">
            Film kezelése
        </h1>

        <p class="lead text-secondary">
            Add meg a film adatait, majd mentsd el
            a változtatásokat.
        </p>

    </section>

    <!-- Adminisztrációs navigáció -->
    <div class="d-flex flex-wrap gap-2 mb-4">

        <a th:href="@{/admin}"
           class="btn btn-outline-secondary">
            Admin főoldal
        </a>

        <a th:href="@{/admin/filmek}"
           class="btn btn-outline-primary">
            Filmek kezelése
        </a>

    </div>

    <!-- Űrlap -->
    <section class="row justify-content-center">

        <div class="col-12 col-md-10 col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="h4 mb-4"
                        th:text="${film.id == null}
                            ? 'Új film adatai'
                            : 'Film adatainak módosítása'">
                        Film adatai
                    </h2>

                    <!-- Üzleti validációs hiba -->
                    <div th:if="${error != null}"
                         class="alert alert-danger"
                         role="alert"
                         th:text="${error}">
                    </div>

                    <!-- Film hozzáadása / szerkesztése -->
                    <form th:action="@{/admin/filmek/mentes}"
                          th:object="${film}"
                          method="post">

                        <!-- CSRF token -->
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Film azonosítója -->
                        <input type="hidden"
                               th:field="*{id}">

                        <!-- Film címe -->
                        <div class="mb-3">

                            <label for="cim"
                                   class="form-label">
                                Film címe
                            </label>

                            <input type="text"
                                   id="cim"
                                   th:field="*{cim}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('cim')} ? 'is-invalid'"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('cim')}"
                                 th:errors="*{cim}">
                            </div>

                        </div>

                        <!-- Megjelenési év -->
                        <div class="mb-3">

                            <label for="ev"
                                   class="form-label">
                                Megjelenési év
                            </label>

                            <input type="number"
                                   id="ev"
                                   th:field="*{ev}"
                                   min="1888"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('ev')} ? 'is-invalid'"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('ev')}"
                                 th:errors="*{ev}">
                            </div>

                        </div>

                        <!-- Film hossza -->
                        <div class="mb-4">

                            <label for="hossz"
                                   class="form-label">
                                Film hossza (perc)
                            </label>

                            <input type="number"
                                   id="hossz"
                                   th:field="*{hossz}"
                                   min="1"
                                   max="400"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('hossz')} ? 'is-invalid'"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('hossz')}"
                                 th:errors="*{hossz}">
                            </div>

                            <div class="form-text">
                                A film hossza 1 és 400 perc
                                között lehet.
                            </div>

                        </div>

                        <!-- Mentés és mégse -->
                        <div class="d-flex flex-wrap gap-2">

                            <button type="submit"
                                    class="btn btn-primary"
                                    th:text="${film.id == null}
                                        ? 'Film hozzáadása'
                                        : 'Módosítások mentése'">
                                Mentés
                            </button>

                            <a th:href="@{/admin/filmek}"
                               class="btn btn-outline-secondary">
                                Mégse
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </section>

    <!-- Visszanavigálás -->
    <div class="mt-4">

        <a th:href="@{/admin/filmek}"
           class="btn btn-outline-secondary">
            Vissza a filmek kezeléséhez
        </a>

    </div>

</main>

<!-- Közös lábléc -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JavaScript -->
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
