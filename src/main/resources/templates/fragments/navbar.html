
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar">

    <!-- Minden látogató számára elérhető menüpontok -->
    <a th:href="@{/}">Főoldal</a> |

    <a th:href="@{/filmek}">Filmek</a> |

    <a th:href="@{/mozik}">Mozik</a> |

    <a th:href="@{/eloadasok}">Előadások</a> |

    <a th:href="@{/kapcsolat}">Kapcsolat</a> |

    <a th:href="@{/diagram}">Diagram</a> |

    <a th:href="@{/rest}">REST</a>

    <!-- Bejelentkezett felhasználók menüpontjai -->
    <span sec:authorize="isAuthenticated()">

        | <a th:href="@{/uzenetek}">Üzenetek</a>

    </span>

    <!-- Csak adminisztrátorok számára -->
    <span sec:authorize="hasRole('ADMIN')">

        | <a th:href="@{/admin}">Admin</a>

    </span>

    <!-- Kijelentkezett felhasználók -->
    <span sec:authorize="isAnonymous()">

        | <a th:href="@{/login}">Bejelentkezés</a>

        | <a th:href="@{/register}">Regisztráció</a>

    </span>

    <!-- Bejelentkezett felhasználó adatai -->
    <span sec:authorize="isAuthenticated()">

        | Bejelentkezve:
        <strong sec:authentication="name"></strong>

        <form th:action="@{/logout}"
              method="post"
              style="display: inline;">

            <button type="submit">
                Kijelentkezés
            </button>

        </form>

    </span>

</nav>

</body>
</html>
