
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar">

    <!-- Minden látogató számára elérhető -->
    <a th:href="@{/}">Főoldal</a>
    |
    <a th:href="@{/filmek}">Filmek</a>
    |
    <a th:href="@{/mozik}">Mozik</a>
    |
    <a th:href="@{/eloadasok}">Előadások</a>
    |
    <a th:href="@{/kapcsolat}">Kapcsolat</a>

    <!-- Bejelentkezett felhasználók -->
    <span sec:authorize="isAuthenticated()">
        |
        <a th:href="@{/uzenetek}">Üzenetek</a>
    </span>

    <!-- Adminisztrátorok -->
    <span sec:authorize="hasRole('ADMIN')">
        |
        <a th:href="@{/admin}">Admin</a>
    </span>

    <!-- Vendégek -->
    <span sec:authorize="isAnonymous()">
        |
        <a th:href="@{/login}">Bejelentkezés</a>
        |
        <a th:href="@{/register}">Regisztráció</a>
    </span>

    <!-- Bejelentkezett felhasználók -->
    <span sec:authorize="isAuthenticated()">
        |
        <span>
            Felhasználó:
            <strong sec:authentication="name"></strong>
        </span>

        <form th:action="@{/logout}"
              method="post"
              style="display: inline;">

            <button type="submit">
                Kijelentkezés
            </button>

        </form>
    </span>

</nav>

</body>
</html>
