
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mozik kezelése - Admin</title>
</head>

<body>

<h1>Mozik kezelése</h1>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<hr>

<!-- Adminisztrációs műveletek -->
<nav>
    <a th:href="@{/admin}">Admin főoldal</a>
    |
    <a th:href="@{/admin/mozik/uj}">
        Új mozi hozzáadása
    </a>
</nav>

<hr>

<!-- Sikeres művelet üzenete -->
<p th:if="${success != null}"
   th:text="${success}"
   style="color: green;">
</p>

<!-- Sikertelen művelet üzenete -->
<p th:if="${error != null}"
   th:text="${error}"
   style="color: red;">
</p>

<!-- Mozik táblázata -->
<table border="1" cellpadding="8" cellspacing="0">

    <thead>
    <tr>
        <th>ID</th>
        <th>Mozi neve</th>
        <th>Város</th>
        <th>Férőhely</th>
        <th>Műveletek</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="mozi : ${mozik}">

        <td th:text="${mozi.id}"></td>

        <td th:text="${mozi.nev}"></td>

        <td th:text="${mozi.varos}"></td>

        <td th:text="${mozi.ferohely}"></td>

        <td>

            <!-- Szerkesztés -->
            <a th:href="@{/admin/mozik/szerkesztes/{id}(id=${mozi.id})}">
                Szerkesztés
            </a>

            <!-- Törlés -->
            <form th:action="@{/admin/mozik/torles/{id}(id=${mozi.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        onclick="return confirm('Biztosan törölni szeretnéd ezt a mozit?');">
                    Törlés
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<!-- Üres lista kezelése -->
<p th:if="${#lists.isEmpty(mozik)}">
    Jelenleg nincs mozi az adatbázisban.
</p>

<hr>

<a th:href="@{/admin}">Vissza az admin főoldalra</a>

</body>
</html>
