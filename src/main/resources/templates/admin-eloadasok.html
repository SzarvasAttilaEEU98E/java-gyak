
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Előadások kezelése - Admin</title>
</head>

<body>

<h1>Előadások kezelése</h1>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<hr>

<!-- Adminisztrációs műveletek -->
<nav>
    <a th:href="@{/admin}">Admin főoldal</a>
    |
    <a th:href="@{/admin/eloadasok/uj}">
        Új előadás hozzáadása
    </a>
</nav>

<hr>

<!-- Előadások táblázata -->
<table border="1" cellpadding="8" cellspacing="0">

    <thead>
    <tr>
        <th>ID</th>
        <th>Film címe</th>
        <th>Mozi neve</th>
        <th>Dátum</th>
        <th>Nézőszám</th>
        <th>Bevétel (Ft)</th>
        <th>Műveletek</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="eloadas : ${eloadasok.content}">

        <td th:text="${eloadas.id}"></td>

        <td th:text="${eloadas.filmCim}"></td>

        <td th:text="${eloadas.moziNev}"></td>

        <td th:text="${eloadas.datum}"></td>

        <td th:text="${eloadas.nezoszam}"></td>

        <td th:text="${eloadas.bevetel}"></td>

        <td>

            <!-- Szerkesztés -->
            <a th:href="@{/admin/eloadasok/szerkesztes/{id}(id=${eloadas.id})}">
                Szerkesztés
            </a>

            <!-- Törlés -->
            <form th:action="@{/admin/eloadasok/torles/{id}(id=${eloadas.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        onclick="return confirm('Biztosan törölni szeretnéd ezt az előadást?');">
                    Törlés
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<!-- Üres lista kezelése -->
<p th:if="${eloadasok.isEmpty()}">
    Jelenleg nincs megjeleníthető előadás.
</p>

<!-- Lapozás -->
<div th:if="${totalPages > 1}">

    <hr>

    <a th:if="${currentPage > 0}"
       th:href="@{/admin/eloadasok(page=${currentPage - 1})}">
        Előző
    </a>

    <span>
        Oldal:
        <strong th:text="${currentPage + 1}"></strong>
        /
        <strong th:text="${totalPages}"></strong>
    </span>

    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/admin/eloadasok(page=${currentPage + 1})}">
        Következő
    </a>

</div>

<hr>

<a th:href="@{/admin}">Vissza az admin főoldalra</a>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
