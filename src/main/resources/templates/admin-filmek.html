
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmek kezelése - Admin</title>
</head>
<body>

<h1>Filmek kezelése</h1>

<nav>
    <a th:href="@{/admin}">Admin főoldal</a>
    |
    <a th:href="@{/filmek}">Filmek megtekintése</a>
    |
    <a th:href="@{/admin/filmek}">Filmek kezelése</a>
</nav>

<hr>

<h2>Filmek listája</h2>

<p>
    <a th:href="@{/admin/filmek/uj}">
        Új film hozzáadása
    </a>
</p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Cím</th>
        <th>Év</th>
        <th>Hossz (perc)</th>
        <th>Műveletek</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="film : ${filmek}">
        <td th:text="${film.id}"></td>
        <td th:text="${film.cim}"></td>
        <td th:text="${film.ev}"></td>
        <td th:text="${film.hossz}"></td>

        <td>
            <a th:href="@{/admin/filmek/szerkesztes/{id}(id=${film.id})}">
                Szerkesztés
            </a>

            <form th:action="@{/admin/filmek/torles/{id}(id=${film.id})}"
                  method="post"
                  style="display:inline;"
                  onsubmit="return confirm('Biztosan törölni szeretnéd ezt a filmet?');">

                <button type="submit">Törlés</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(filmek)}">
    Jelenleg nincsenek filmek az adatbázisban.
</p>

<hr>

<form th:action="@{/logout}" method="post">
    <button type="submit">Kijelentkezés</button>
</form>

</body>
</html>
