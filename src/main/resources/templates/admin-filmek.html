
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">

<!-- Közös HEAD: Bootstrap 5 és saját CSS -->
<head th:replace="~{fragments/head :: head('Filmek kezelése')}"></head>

<body>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Oldal tartalma -->
<main class="container py-5">

    <!-- Oldal címe -->
    <section class="mb-4">

        <h1 class="display-5 fw-bold">
            Filmek kezelése
        </h1>

        <p class="lead text-secondary">
            Az adatbázisban található filmek
            hozzáadása, szerkesztése és törlése.
        </p>

    </section>

    <!-- Adminisztrációs műveletek -->
    <div class="d-flex flex-wrap gap-2 mb-4">

        <a th:href="@{/admin}"
           class="btn btn-outline-secondary">
            Admin főoldal
        </a>

        <a th:href="@{/admin/filmek/uj}"
           class="btn btn-primary">
            + Új film hozzáadása
        </a>

    </div>

    <!-- Sikeres művelet üzenete -->
    <div th:if="${success != null}"
         class="alert alert-success"
         role="alert"
         th:text="${success}">
    </div>

    <!-- Sikertelen művelet üzenete -->
    <div th:if="${error != null}"
         class="alert alert-danger"
         role="alert"
         th:text="${error}">
    </div>

    <!-- Filmek táblázata -->
    <section class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h2 class="h4 mb-4">
                Adatbázisban található filmek
            </h2>

            <!-- Reszponzív táblázat -->
            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(filmek)}">

                <table class="table table-striped
                              table-hover table-bordered
                              align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Film címe</th>
                        <th scope="col">Megjelenési év</th>
                        <th scope="col">Hossz (perc)</th>
                        <th scope="col">Műveletek</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="film : ${filmek}">

                        <td th:text="${film.id}"></td>

                        <td th:text="${film.cim}"></td>

                        <td th:text="${film.ev}"></td>

                        <td th:text="${film.hossz}"></td>

                        <td>

                            <div class="d-flex flex-wrap gap-2">

                                <!-- Szerkesztés -->
                                <a th:href="@{/admin/filmek/szerkesztes/{id}(id=${film.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Szerkesztés
                                </a>

                                <!-- Törlés -->
                                <form th:action="@{/admin/filmek/torles/{id}(id=${film.id})}"
                                      method="post">

                                    <!-- CSRF token -->
                                    <input type="hidden"
                                           th:if="${_csrf != null}"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Biztosan törölni szeretnéd ezt a filmet?');">
                                        Törlés
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- Üres lista kezelése -->
            <div class="alert alert-info"
                 th:if="${#lists.isEmpty(filmek)}"
                 role="alert">

                Jelenleg nincs film az adatbázisban.

            </div>

        </div>

    </section>

    <!-- Visszanavigálás -->
    <div class="mt-4">

        <a th:href="@{/admin}"
           class="btn btn-outline-secondary">
            Vissza az admin főoldalra
        </a>

    </div>

</main>

<!-- Közös lábléc -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JavaScript -->
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
