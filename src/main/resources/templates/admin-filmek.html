
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Filmek kezelése - Admin</title>
</head>

<body>

<h1>Filmek kezelése</h1>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<hr>

<!-- Adminisztrációs műveletek -->
<nav>
    <a th:href="@{/admin}">Admin főoldal</a>
    |
    <a th:href="@{/admin/filmek/uj}">
        Új film hozzáadása
    </a>
</nav>

<hr>

<!-- Sikeres művelet üzenete -->
<p th:if="${success != null}"
   th:text="${success}"
   style="color: green;">
</p>

<!-- Sikertelen művelet üzenete -->
<p th:if="${error != null}"
   th:text="${error}"
   style="color: red;">
</p>

<!-- Filmek táblázata -->
<table border="1" cellpadding="8" cellspacing="0">

    <thead>
    <tr>
        <th>ID</th>
        <th>Film címe</th>
        <th>Megjelenési év</th>
        <th>Hossz (perc)</th>
        <th>Műveletek</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="film : ${filmek}">

        <td th:text="${film.id}"></td>

        <td th:text="${film.cim}"></td>

        <td th:text="${film.ev}"></td>

        <td th:text="${film.hossz}"></td>

        <td>

            <!-- Szerkesztés -->
            <a th:href="@{/admin/filmek/szerkesztes/{id}(id=${film.id})}">
                Szerkesztés
            </a>

            <!-- Törlés -->
            <form th:action="@{/admin/filmek/torles/{id}(id=${film.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        onclick="return confirm('Biztosan törölni szeretnéd ezt a filmet?');">
                    Törlés
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<!-- Üres lista kezelése -->
<p th:if="${#lists.isEmpty(filmek)}">
    Jelenleg nincs film az adatbázisban.
</p>

<hr>

<a th:href="@{/admin}">Vissza az admin főoldalra</a>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
