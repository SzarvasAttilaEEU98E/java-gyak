
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozi kezelése - Admin</title>
</head>
<body>

<h1 th:text="${mozi.id == null} ? 'Új mozi hozzáadása' : 'Mozi szerkesztése'">
    Mozi kezelése
</h1>

<nav>
    <a th:href="@{/admin}">Admin főoldal</a>
    |
    <a th:href="@{/admin/mozik}">Mozik kezelése</a>
</nav>

<hr>

<form th:action="@{/admin/mozik/mentes}"
      th:object="${mozi}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="nev">Mozi neve:</label>
        <input type="text"
               id="nev"
               th:field="*{nev}"
               maxlength="255"
               required>
    </div>

    <br>

    <div>
        <label for="varos">Város:</label>
        <input type="text"
               id="varos"
               th:field="*{varos}"
               maxlength="255"
               required>
    </div>

    <br>

    <div>
        <label for="ferohely">Férőhelyek száma:</label>
        <input type="number"
               id="ferohely"
               th:field="*{ferohely}"
               min="1"
               required>
    </div>

    <br>

    <button type="submit"
            th:text="${mozi.id == null} ? 'Mozi hozzáadása' : 'Módosítások mentése'">
        Mentés
    </button>

    <a th:href="@{/admin/mozik}">Mégse</a>

</form>

<hr>

<form th:action="@{/logout}" method="post">
    <button type="submit">Kijelentkezés</button>
</form>

</body>
</html>
