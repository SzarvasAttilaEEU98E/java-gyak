
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">

<!-- Közös HEAD: Bootstrap 5 és saját CSS -->
<head th:replace="~{fragments/head :: head('Mozi kezelése')}"></head>

<body>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Oldal tartalma -->
<main class="container py-5">

    <!-- Oldal címe -->
    <section class="mb-4">

        <h1 class="display-5 fw-bold"
            th:text="${mozi.id == null}
                ? 'Új mozi hozzáadása'
                : 'Mozi szerkesztése'">
            Mozi kezelése
        </h1>

        <p class="lead text-secondary">
            Add meg a mozi adatait, majd mentsd el
            a változtatásokat.
        </p>

    </section>

    <!-- Adminisztrációs navigáció -->
    <div class="d-flex flex-wrap gap-2 mb-4">

        <a th:href="@{/admin}"
           class="btn btn-outline-secondary">
            Admin főoldal
        </a>

        <a th:href="@{/admin/mozik}"
           class="btn btn-outline-primary">
            Mozik kezelése
        </a>

    </div>

    <!-- Moziűrlap -->
    <section class="row justify-content-center">

        <div class="col-12 col-md-10 col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="h4 mb-4"
                        th:text="${mozi.id == null}
                            ? 'Új mozi adatai'
                            : 'Mozi adatainak módosítása'">
                        Mozi adatai
                    </h2>

                    <!-- Üzleti validációs hiba -->
                    <div th:if="${error != null}"
                         class="alert alert-danger"
                         role="alert"
                         th:text="${error}">
                    </div>

                    <!-- Mozi hozzáadása / szerkesztése -->
                    <form th:action="@{/admin/mozik/mentes}"
                          th:object="${mozi}"
                          method="post">

                        <!-- CSRF token -->
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Mozi azonosítója -->
                        <input type="hidden"
                               th:field="*{id}">

                        <!-- Mozi neve -->
                        <div class="mb-3">

                            <label for="nev"
                                   class="form-label">
                                Mozi neve
                            </label>

                            <input type="text"
                                   id="nev"
                                   th:field="*{nev}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nev')} ? 'is-invalid'"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nev')}"
                                 th:errors="*{nev}">
                            </div>

                        </div>

                        <!-- Város -->
                        <div class="mb-3">

                            <label for="varos"
                                   class="form-label">
                                Város
                            </label>

                            <input type="text"
                                   id="varos"
                                   th:field="*{varos}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('varos')} ? 'is-invalid'"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('varos')}"
                                 th:errors="*{varos}">
                            </div>

                        </div>

                        <!-- Férőhelyek száma -->
                        <div class="mb-4">

                            <label for="ferohely"
                                   class="form-label">
                                Férőhelyek száma
                            </label>

                            <input type="number"
                                   id="ferohely"
                                   th:field="*{ferohely}"
                                   min="1"
                                   max="10000"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('ferohely')} ? 'is-invalid'"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('ferohely')}"
                                 th:errors="*{ferohely}">
                            </div>

                            <div class="form-text">
                                A férőhelyek száma 1 és 10 000
                                között lehet.
                            </div>

                        </div>

                        <!-- Mentés és mégse -->
                        <div class="d-flex flex-wrap gap-2">

                            <button type="submit"
                                    class="btn btn-primary"
                                    th:text="${mozi.id == null}
                                        ? 'Mozi hozzáadása'
                                        : 'Módosítások mentése'">
                                Mentés
                            </button>

                            <a th:href="@{/admin/mozik}"
                               class="btn btn-outline-secondary">
                                Mégse
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </section>

    <!-- Visszanavigálás -->
    <div class="mt-4">

        <a th:href="@{/admin/mozik}"
           class="btn btn-outline-secondary">
            Vissza a mozik kezeléséhez
        </a>

    </div>

</main>

<!-- Közös lábléc -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JavaScript -->
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
