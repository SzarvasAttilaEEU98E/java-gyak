
<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">

<!-- Közös HEAD: Bootstrap 5 és saját CSS -->
<head th:replace="~{fragments/head :: head('Mozik')}"></head>

<body>

<!-- Közös navigációs menü -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Oldal tartalma -->
<main class="container py-5">

    <section class="mb-4">

        <h1 class="display-5 fw-bold">
            Mozik listája
        </h1>

        <p class="text-secondary">
            Az adatbázisban található mozik
            megtekintése.
        </p>

    </section>

    <section class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h2 class="h4 mb-4">
                Adatbázisban található mozik
            </h2>

            <!-- Reszponzív táblázat -->
            <div class="table-responsive">

                <table class="table table-striped table-hover
                              table-bordered align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Név</th>
                        <th scope="col">Város</th>
                        <th scope="col">Férőhely</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="mozi : ${mozik}">

                        <td th:text="${mozi.id}"></td>

                        <td th:text="${mozi.nev}"></td>

                        <td th:text="${mozi.varos}"></td>

                        <td th:text="${mozi.ferohely}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- Üres adatbázis esetén -->
            <div class="alert alert-info"
                 th:if="${#lists.isEmpty(mozik)}">

                Jelenleg nincsenek mozik az adatbázisban.

            </div>

        </div>

    </section>

    <!-- Visszanavigálás -->
    <div class="mt-4">

        <a th:href="@{/}"
           class="btn btn-outline-secondary">

            Vissza a főoldalra

        </a>

        <a th:href="@{/adatbazis}"
           class="btn btn-outline-primary ms-2">

            Adatbázis áttekintése

        </a>

    </div>

</main>

<!-- Közös lábléc -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JavaScript -->
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
